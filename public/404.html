<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting — M.S Ayurvedic Centre</title>
    <script>
      // Single Page App redirect for GitHub Pages (handles custom domains and repo subpaths)
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      const validPages = ['about', 'treatments', 'offers', 'reviews', 'products', 'contact', 'admin'];
      const matchedPage = parts.find(p => validPages.includes(p.toLowerCase()));
      const targetHash = matchedPage ? '#' + matchedPage.toLowerCase() : '';
      
      // If deployed at root (custom domain), rootPath is '/'
      // If deployed at username.github.io/repo/, first part is repo name so rootPath is '/repo/'
      const isSubpath = parts.length > 0 && !validPages.includes(parts[0].toLowerCase());
      const rootPath = isSubpath ? '/' + parts[0] + '/' : '/';
      
      window.location.replace(rootPath + targetHash + window.location.search);
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; padding: 50px;">Redirecting to M.S Ayurvedic Centre...</p>
  </body>
</html>
